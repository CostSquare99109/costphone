name: Build CostPhone APK

on:
  workflow_dispatch:
  push:
    branches:
      - mi-cambio
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Verify Android SDK setup
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "SDK root exists: $([ -d "$ANDROID_HOME" ] && echo yes || echo no)"
          # List ANDROID_HOME contents
          ls -la "$ANDROID_HOME"/platforms/ 2>/dev/null || echo "No platforms dir"
          ls -la "$ANDROID_HOME"/build-tools/ 2>/dev/null || echo "No build-tools dir"
          # Check sdkmanager availability
          which sdkmanager 2>/dev/null || echo "sdkmanager not in PATH"
          # Try sdkmanager --help
          sdkmanager --list 2>&1 | head -5 || echo "sdkmanager list failed"

      - name: Install platform and build-tools (>= 34)
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME"
          # Verify installation
          echo "Checking installed platforms:"
          ls "$ANDROID_HOME"/platforms/android-34/ 2>/dev/null || echo "android-34 not found"
          echo "Checking build-tools:"
          ls "$ANDROID_HOME"/build-tools/ 2>/dev/null || echo "No build-tools dir"
          # Verify aapt2 is available
          which aapt2 2>/dev/null || echo "aapt2 not found"
          # Verify d8 is available
          which d8 2>/dev/null || echo "d8 not found"
          # Verify apksigner is available
          which apksigner 2>/dev/null || echo "apksigner not found"

      - name: Check keystore secret present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 esta vacio. CostPhone no se firma con clave de debug en CI."
            exit 1
          fi
          echo "KEYSTORE_BASE64 presente."

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > /tmp/costphone.keystore
          echo "KEYSTORE_PATH=/tmp/costphone.keystore" >> "$GITHUB_ENV"

      - name: Build APK with diagnostics
        env:
          KEYSTORE_PATH: /tmp/costphone.keystore
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd app
          # Initialize exit code
          BASH_EXIT=0
          # Save build script output and exit code
          bash -x build.sh > build_output.txt 2>&1 || BASH_EXIT=$?
          echo "BASH_EXIT=$BASH_EXIT" >> build_output.txt
          tail -n 80 build_output.txt > build_output.tmp && mv build_output.tmp build_output.txt
          # Always save diagnostics even on failure
          mkdir -p diag-artifacts
          cp build_output.txt diag-artifacts/build_output.txt
          # Mask passwords in build output for GitHub Actions log safety
          sed -i -E 's/(KEYSTORE_PASSWORD|KEY_PASSWORD|KEY_ALIAS)=.*/\1=***/g' build_output.txt
          # Copy internal diagnostic from app/build/
          if [ -f build/.build-diagnostic.txt ]; then
              cp build/.build-diagnostic.txt diag-artifacts/build-diagnostic.txt
          else
              echo "Diagnostic file build/.build-diagnostic.txt not found"
          fi
          # Check APK status after build
          if [ -f build/CostPhone.apk ] && [ -s build/CostPhone.apk ]; then
              echo "APK exists and has content: $(wc -c < build/CostPhone.apk) bytes"
          else
              echo "APK not found or empty after build"
              BASH_EXIT=1
          fi
          # Propagate error code if build failed
          if [[ $BASH_EXIT -ne 0 ]]; then
            exit $BASH_EXIT
          fi

      - name: Diagnostics Summary (if failed)
        if: failure()
        run: |
          echo "=== Build Failed Summary ==="
          # Show build output from the last 200 lines (app/ directory)
          if [ -f app/build_output.txt ]; then
              echo "--- Build output (last 200 lines) ---"
              tail -n 200 app/build_output.txt
              echo "--- End of build output ---"
          else
              echo "No app/build_output.txt found"
          fi
          # Show build diagnostic if available (app/diag-artifacts/ directory)
          if [ -f app/diag-artifacts/build-diagnostic.txt ]; then
              echo "--- Build diagnostic (app/diag-artifacts/build-diagnostic.txt) ---"
              cat app/diag-artifacts/build-diagnostic.txt
              echo "--- End of build diagnostic ---"
          else
              echo "No app/diag-artifacts/build-diagnostic.txt found"
          fi
          # Check APK status
          if [ -f build/CostPhone.apk ]; then
              echo "APK exists: $(wc -c < build/CostPhone.apk) bytes"
              "$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner" verify --print-certs build/CostPhone.apk 2>&1 | head -5 || echo "Verification not possible"
          else
              echo "APK not found after build - see build_output.txt for errors"
          fi

      - name: Print APK certificate SHA-256
        run: |
          cd app
          "$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner" verify --print-certs build/CostPhone.apk | grep -i 'sha-256' || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CostPhone
          path: app/build/CostPhone.apk
          if-no-files-found: error

      - name: Upload diagnostic artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostics
          path: app/diag-artifacts/

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/CostPhone.apk

