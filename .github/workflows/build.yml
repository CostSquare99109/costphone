name: Build CostPhone APK

on:
  workflow_dispatch:
  push:
    branches:
      - mi-cambio
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install platform and build-tools (>= 34)
        run: |
          set -euo pipefail
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Check keystore secret present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 esta vacio. CostPhone no se firma con clave de debug en CI."
            exit 1
          fi
          echo "KEYSTORE_BASE64 presente."

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > /tmp/costphone.keystore
          echo "KEYSTORE_PATH=/tmp/costphone.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          KEYSTORE_PATH: /tmp/costphone.keystore
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd app
          bash build.sh
          ls -la build/CostPhone.apk

      - name: Print APK certificate SHA-256
        run: |
          cd app
          "$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner" verify --print-certs build/CostPhone.apk | grep -i 'sha-256' || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CostPhone
          path: app/build/CostPhone.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/CostPhone.apk
